version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    # goconst and prealloc are disabled for now: their v2 implementations surface
    # pre-existing findings across the repo; re-enabling them together with the
    # cleanup is tracked as a follow-up.
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: unused-parameter
    # v1 enabled the SA-only staticcheck linter; ST*/QF* (ex-stylecheck/quickfix)
    # were never part of this repo's gate.
    staticcheck:
      checks:
        - SA*
    govet:
      disable:
        # false-positives on generic maps.Copy/maps.Clone
        - inline
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
